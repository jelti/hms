<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Journal">
<title>Journal Spasmes</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#fff;--card:#f7f7f7;--border:#e8e8e8;--border2:#d0d0d0;
  --text:#111;--mid:#555;--faint:#999;
  --accent:#b07d30;--accent-l:#f5ead8;
  --red:#d63031;--green:#00864a;--purple:#6c3483;--blue:#1a5276;--teal:#0e6655;
  --orange:#c0392b;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--text);font-family:'Lora',serif;max-width:480px;margin:0 auto;min-height:100vh;}
button{font-family:inherit;cursor:pointer;}

.hdr{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--border);padding:18px 20px 0;}
.hdr-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.hdr-title{font-size:19px;font-weight:600;}
.hdr-title em{font-family:'DM Mono',monospace;font-size:10px;font-style:normal;color:var(--accent);letter-spacing:3px;}
#save-st{font-family:'DM Mono',monospace;font-size:9px;color:var(--green);}
.tabs{display:flex;}
.tab{padding:9px 16px;font-size:12px;font-family:'DM Mono',monospace;border:none;border-bottom:2px solid transparent;background:transparent;color:var(--faint);transition:all .15s;}
.tab.on{border-bottom-color:var(--accent);color:var(--accent);}

.dstrip{display:flex;gap:8px;padding:12px 20px;overflow-x:auto;border-bottom:1px solid var(--border);scrollbar-width:none;}
.dstrip::-webkit-scrollbar{display:none;}
.dbtn{min-width:46px;height:54px;border-radius:11px;flex-shrink:0;border:2px solid var(--border);background:var(--card);color:var(--mid);font-family:'DM Mono',monospace;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;transition:all .12s;}
.dbtn.on{border-color:var(--accent);background:var(--accent);color:#fff;}
.dbtn .dn{font-size:16px;font-weight:700;}
.dbtn .dw{font-size:9px;}
.ddot{width:4px;height:4px;border-radius:50%;background:var(--accent);}
.dbtn.on .ddot{background:#fff;}

.content{padding:6px 20px 120px;}
.view{display:none;}.view.on{display:block;}

.div{display:flex;align-items:center;gap:8px;margin:26px 0 14px;}
.div-lbl{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:3px;text-transform:uppercase;}
.div-line{flex:1;height:1px;background:var(--border);}

.slbl{font-size:13px;color:var(--mid);margin-bottom:8px;}
.sublbl-help{font-family:'DM Mono',monospace;font-size:9px;color:var(--faint);letter-spacing:1px;margin-bottom:8px;font-style:italic;}
.sbtns{display:flex;gap:7px;}
.sbtn{width:42px;height:42px;border-radius:10px;border:2px solid var(--border);background:var(--bg);color:var(--faint);font-family:'DM Mono',monospace;font-size:17px;font-weight:700;transition:all .12s;flex-shrink:0;}
.sbtn.on{color:#fff;}

.tbtns{display:flex;gap:7px;flex-wrap:wrap;}
.tbtn{padding:8px 13px;border-radius:8px;border:2px solid var(--border);background:var(--bg);color:var(--mid);font-family:'DM Mono',monospace;font-size:12px;font-weight:600;transition:all .12s;}
.tbtn.on{color:#fff;}

input,textarea{background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'Lora',serif;font-size:13px;padding:9px 12px;width:100%;outline:none;}
input::placeholder,textarea::placeholder{color:var(--faint);}
textarea{resize:vertical;}

.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;}
.ctitle{font-family:'DM Mono',monospace;font-size:10px;color:var(--accent);letter-spacing:2px;margin-bottom:12px;}
.r2{display:flex;gap:8px;margin-bottom:10px;}
.r2:last-child{margin-bottom:0;}
.f1{flex:1;}
.sublbl{font-family:'DM Mono',monospace;font-size:10px;color:var(--faint);letter-spacing:1px;margin-bottom:6px;text-transform:uppercase;}
.mlbl{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:2px;margin:18px 0 10px;text-transform:uppercase;}

/* === 7 PILIERS === */
.pillar{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px;transition:all .15s;}
.pillar.done{background:#edfbf3;border-color:rgba(0,134,74,.3);}
.pillar-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.pillar-icon{font-size:20px;flex-shrink:0;}
.pillar-name{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:2px;font-weight:700;color:var(--text);text-transform:uppercase;flex:1;}
.pillar.done .pillar-name{color:var(--green);}
.pillar-hint{font-family:'DM Mono',monospace;font-size:9px;color:var(--faint);letter-spacing:1px;margin-bottom:10px;font-style:italic;}

/* Inferred badge */
.inferred-badge{display:inline-block;background:#fff8ec;color:var(--accent);font-family:'DM Mono',monospace;font-size:8px;letter-spacing:1px;padding:2px 6px;border-radius:4px;margin-left:6px;font-weight:600;text-transform:uppercase;border:1px solid rgba(176,125,48,.3);}

/* Pillar toggle Oui/Non */
.pillar-toggle{display:flex;gap:7px;margin-bottom:10px;}
.pillar-yes{flex:1;padding:10px;border-radius:8px;border:2px solid var(--border);background:var(--bg);color:var(--mid);font-family:'DM Mono',monospace;font-size:12px;font-weight:600;transition:all .12s;}
.pillar-yes.on{background:var(--green);border-color:var(--green);color:#fff;}
.pillar-no{flex:1;padding:10px;border-radius:8px;border:2px solid var(--border);background:var(--bg);color:var(--mid);font-family:'DM Mono',monospace;font-size:12px;font-weight:600;transition:all .12s;}
.pillar-no.on{background:var(--mid);border-color:var(--mid);color:#fff;}

.pillar-fields{display:none;flex-direction:column;gap:10px;margin-top:10px;}
.pillar-fields.show{display:flex;}

/* Migration banner */
.mig-banner{background:#fff8ec;border:1px solid rgba(176,125,48,.3);border-radius:12px;padding:12px 14px;margin:12px 0;font-family:'DM Mono',monospace;font-size:11px;color:var(--accent);}
.mig-banner-close{float:right;background:transparent;border:none;color:var(--accent);font-size:14px;cursor:pointer;padding:0 4px;}

/* Collapsible legacy programs */
.legacy-toggle{width:100%;background:var(--card);border:1px dashed var(--border2);border-radius:12px;padding:14px;font-family:'DM Mono',monospace;font-size:11px;color:var(--faint);letter-spacing:2px;text-transform:uppercase;text-align:center;transition:all .15s;}
.legacy-toggle:hover{border-color:var(--accent);color:var(--accent);}
.legacy-toggle .arrow{display:inline-block;margin-left:8px;transition:transform .2s;}
.legacy-toggle.open .arrow{transform:rotate(180deg);}
.legacy-content{display:none;margin-top:10px;}
.legacy-content.show{display:block;}

/* Exercise rows */
.exrow{display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px;margin-bottom:7px;background:var(--card);border:1px solid var(--border);border-radius:11px;text-align:left;transition:all .12s;}
.exrow.on{background:#edfbf3;border-color:var(--green);}
.excheck{width:24px;height:24px;border-radius:6px;flex-shrink:0;background:transparent;border:2px solid var(--border2);display:flex;align-items:center;justify-content:center;transition:all .12s;}
.exrow.on .excheck{background:var(--green);border-color:var(--green);}
.exmark{color:#fff;font-size:14px;font-weight:800;display:none;}
.exrow.on .exmark{display:block;}
.exlbl{font-size:14px;color:var(--mid);}
.exrow.on .exlbl{color:var(--green);}

/* Day type section */
.day-section{border-radius:14px;padding:14px;margin-bottom:12px;}
.day-section.jogging{background:#f0faf8;border:1px solid rgba(14,102,85,.2);}
.day-section.renfo{background:#f5f0fb;border:1px solid rgba(108,52,131,.2);}
.day-section.commun{background:#f5ead8;border:1px solid rgba(176,125,48,.25);}
.day-section-title{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:2px;font-weight:700;margin-bottom:4px;text-transform:uppercase;}
.day-section-sub{font-family:'DM Mono',monospace;font-size:9px;margin-bottom:12px;opacity:.7;}
.day-section.jogging .day-section-title{color:var(--teal);}
.day-section.renfo .day-section-title{color:var(--purple);}
.day-section.commun .day-section-title{color:var(--accent);}
.day-section .exrow{background:#fff;}
.day-section.jogging .exrow.on{background:#d4f5e9;border-color:var(--green);}
.day-section.renfo .exrow.on{background:#ede0f7;border-color:var(--purple);}
.day-section.renfo .exrow.on .excheck{background:var(--purple);border-color:var(--purple);}
.day-section.commun .exrow.on{background:#f5ead8;border-color:var(--accent);}
.day-section.commun .exrow.on .excheck{background:var(--accent);border-color:var(--accent);}
.day-section.commun .exrow.on .exlbl{color:var(--accent);}
.day-section.renfo .exrow.on .exlbl{color:var(--purple);}

.step-lbl{font-family:'DM Mono',monospace;font-size:9px;color:var(--faint);letter-spacing:1px;margin:10px 0 6px;text-transform:uppercase;}
.step-lbl:first-child{margin-top:0;}

.scard{background:#f0faf8;border:1px solid rgba(14,102,85,.2);border-radius:12px;padding:14px;margin-top:10px;}
.imp-res{margin-top:12px;padding:10px 14px;border-radius:10px;font-family:'DM Mono',monospace;font-size:12px;}

.hcard{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:10px;cursor:pointer;}
.htop{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.hdate{font-family:'DM Mono',monospace;font-size:11px;color:var(--accent);letter-spacing:1px;}
.hscore{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:'DM Mono',monospace;font-weight:700;font-size:15px;color:#fff;}
.badges{display:flex;gap:7px;flex-wrap:wrap;}
.badge{border-radius:6px;padding:4px 9px;font-size:11px;font-family:'DM Mono',monospace;}
.hnotes{margin-top:9px;font-size:12px;color:var(--faint);font-style:italic;}

.expbtn{position:fixed;bottom:24px;right:20px;background:var(--accent);color:#fff;border:none;border-radius:50px;padding:13px 22px;font-family:'DM Mono',monospace;font-size:12px;font-weight:600;box-shadow:0 4px 16px rgba(176,125,48,.4);z-index:100;transition:transform .1s;}
.expbtn:active{transform:scale(.96);}

.mb16{margin-bottom:16px;}
.mb14{margin-bottom:14px;}
.mb10{margin-bottom:10px;}
.mb8{margin-bottom:8px;}
.mb6{margin-bottom:6px;}
.gap8{gap:8px;}

.sbtns.wide .sbtn{width:38px;height:38px;font-size:15px;}
.sbtns.score10{flex-wrap:wrap;}
.sbtns.score10 .sbtn{width:38px;height:38px;font-size:14px;}

/* Allégement card */
.alleg-card{background:#edfbf3;border:1px solid rgba(0,134,74,.2);border-radius:12px;padding:14px;margin-top:10px;}
.alleg-card .ctitle{color:var(--green);}

/* Wakeup highlight */
.wakeup{background:linear-gradient(135deg,#fff8ec 0%,#f5ead8 100%);border:1px solid rgba(176,125,48,.3);border-radius:14px;padding:14px;margin-bottom:12px;}
.wakeup-title{font-family:'DM Mono',monospace;font-size:10px;color:var(--accent);letter-spacing:2px;font-weight:700;margin-bottom:10px;text-transform:uppercase;}

/* Anchor hint */
.anchor-hint{font-family:'DM Mono',monospace;font-size:9px;color:var(--faint);letter-spacing:1px;margin-top:6px;font-style:italic;line-height:1.4;}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-top">
    <div class="hdr-title">Journal <em>SPASMES</em></div>
    <span id="save-st">✓ sauvegardé</span>
  </div>
  <div class="tabs">
    <button class="tab on" onclick="switchTab('form')">Saisie</button>
    <button class="tab" onclick="switchTab('history')">Historique</button>
  </div>
</div>

<div class="dstrip" id="dstrip"></div>
<div class="content">
  <div class="view on" id="form-view"></div>
  <div class="view" id="history-view"></div>
</div>

<button class="expbtn" onclick="exportJSON()">⬇ Exporter JSON</button>

<script>
const SK = 'journal_spasmes_MASTER';
const MIGRATION_VERSION = 1;
const MIG_KEY = 'journal_spasmes_MIG_VERSION';

// ── Micro-gestes (visibles en haut, réutilisent togEx/exercices) ──
const MICRO_GESTES = [
  {id:'chin_tucks', label:'Chin tuck (10–15 rép)'},
  {id:'cercles_scapulaires', label:'Cercles scapulaires lents (1 min)'},
  {id:'prise_conscience', label:'Prise de conscience corporelle (en marchant)'},
];

// ── Anciens exercices (panneau caché) ──
const EX_SECTIONS = [
  {
    id: 'commun', label: '🔄 LES DEUX JOURS', sub: 'À tout moment de la journée', cls: 'commun',
    steps: [
      { label: '🔄 Journée', items: [
        {id:'prise_conscience', label:'Prise de conscience posturale (alarme horaire)'},
        {id:'extension_nuque', label:'Extension de nuque douce (réflexe)'},
        {id:'scm', label:'Étirement SCM gauche (2 × 30 sec)'},
        {id:'cercles_scapulaires', label:'Cercles scapulaires (2 min)'},
      ]},
      { label: '🌙 Soir', items: [
        {id:'respiration_diaphragmatique', label:'Respiration diaphragmatique (5 min)'},
      ]},
    ]
  },
  {
    id: 'jogging', label: '🏃 JOUR JOGGING', sub: 'Chaleur → Jogging → Automassage', cls: 'jogging',
    steps: [
      { label: '💪 Renforcement', items: [
        {id:'pompes', label:'Pompes (séries selon niveau)'},
        {id:'planche', label:'Planche (maintien 30–60 sec)'},
      ]},
      { label: '💆 Après jogging', items: [
        {id:'automassage', label:'Automassage inter-scapulaire (balle/poings)'},
        {id:'trapeze', label:'Étirement trapèze gauche'},
      ]},
    ]
  },
  {
    id: 'renfo', label: '💪 JOUR RENFORCEMENT', sub: 'Chaleur → Renforcement → Automassage', cls: 'renfo',
    steps: [
      { label: '🌅 En premier', items: [
        {id:'chaleur_renfo', label:'Chaleur — gilet/pad omoplates + nuque (10–15 min)'},
      ]},
      { label: '💪 Renforcement scapulaire', items: [
        {id:'retraction_omoplates', label:'Rétraction des omoplates (15 rép × 2)'},
        {id:'ytw', label:'Y-T-W (8–10 rép par lettre)'},
        {id:'face_pulls', label:'Face pulls élastique (12–15 rép × 2)'},
        {id:'chin_tucks', label:'Chin tucks — repositionnement cervical (10–15 rép)'},
      ]},
    ]
  },
];

const HIST = [
  {date:"2026-03-13",spasmes:{intensite:3,frequence:3,gene:3},allegement:{oui:false,moment:"",facteurs:"",avant:null,apres:null},sport:{marche:{duree:"25",intensite:"L",avant:"",apres:""},jogging:{duree:"",intensite:"",avant:"",apres:"",delai:""}},posture:{trapeze:2,nuque:1,machoire:1,pommette:1},langue:"Oui",respiration:"Orale",exercices:[],social:{oui:null,duree:"",qualite:null,avant:null,apres:null},heures_assis:"2",wellness:{sommeil_qualite:5,energie:5,stress:2,bienetre:3},sommeil_duree:"7h08",sommeil_profond:"54min (92)",sommeil_score:null,magnesium:"Non",hydratation:"1,2L",humeur:"Neutre",notes:"Télétravail 2h assis"},
];

// ── State ──
let entries = {};
let activeDate = today();
let activeTab = 'form';
let legacyOpen = false;
let migrationStats = null;

function today(){return new Date().toISOString().split('T')[0];}
function frDate(s){return new Date(s+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});}

// ════════════════════════════════════════════════════════════
// MIGRATION : remplit les nouveaux champs à partir des anciens
// ════════════════════════════════════════════════════════════
function migrateEntry(e){
  // Si déjà migré, skip
  if(e._migrated_v >= MIGRATION_VERSION) return {entry: e, changed: false};

  const notes = (e.notes || '').toLowerCase();
  const allegFact = ((e.allegement && e.allegement.facteurs) || '').toLowerCase();
  const allegMoment = ((e.allegement && e.allegement.moment) || '').toLowerCase();
  const exercices = e.exercices || [];

  // Init piliers s'il manque
  if(!e.piliers){
    e.piliers = {
      respiration_ventrale: null, relachement_debout: null,
      relachement_allonge: null, relachement_duree: '',
      chaleur: null, chaleur_duree: '', chaleur_type: '',
      jogging: null, jogging_duree: '',
      sommeil_calme: null, social: null, social_type: '',
      massage: null, massage_zone: '',
    };
  }
  if(!e._inferred) e._inferred = {};

  // ── 1) Réveil avec spasme : parsing notes ──
  if(e.reveil_spasme === undefined || e.reveil_spasme === null){
    if(/r[ée]veil.{0,30}sans spasme|r[ée]veil calme|pas de spasme.{0,20}matin|pas de r[ée]veil avec spasme/i.test(notes)){
      e.reveil_spasme = false;
      e._inferred.reveil_spasme = true;
    } else if(/r[ée]veil.{0,30}avec.{0,5}spasme|r[ée]veil.{0,15}spasme/i.test(notes)){
      e.reveil_spasme = true;
      e._inferred.reveil_spasme = true;
    }
  }

  // ── 2) Tension globale gauche : moyenne posture ──
  if(e.tension_globale_gauche === undefined || e.tension_globale_gauche === null){
    const p = e.posture || {};
    const vals = [p.trapeze, p.nuque, p.machoire, p.pommette].filter(x => typeof x === 'number');
    if(vals.length >= 2){
      e.tension_globale_gauche = Math.round(vals.reduce((a,b)=>a+b,0) / vals.length);
      e._inferred.tension_globale_gauche = true;
    }
  }

  // ── 3) Jogging : direct depuis sport.jogging.duree ──
  if(e.piliers.jogging === null){
    const jd = e.sport && e.sport.jogging && e.sport.jogging.duree;
    if(jd){
      e.piliers.jogging = true;
      e.piliers.jogging_duree = String(jd);
      e._inferred.jogging = false; // donnée réelle
    }
  }

  // ── 4) Respiration ventrale : depuis exercices + respiration ──
  if(e.piliers.respiration_ventrale === null){
    const hasDiaph = exercices.includes('respiration_diaphragmatique');
    const resp = (e.respiration || '').toLowerCase();
    if(hasDiaph){
      e.piliers.respiration_ventrale = 4;
      e._inferred.respiration_ventrale = true;
    } else if(resp.startsWith('nasal')){
      e.piliers.respiration_ventrale = 3;
      e._inferred.respiration_ventrale = true;
    } else if(resp.startsWith('mixt') || resp === 'oui'){
      e.piliers.respiration_ventrale = 2;
      e._inferred.respiration_ventrale = true;
    } else if(resp.startsWith('oral')){
      e.piliers.respiration_ventrale = 1;
      e._inferred.respiration_ventrale = true;
    }
  }

  // ── 5) Social : direct depuis social.oui ──
  if(e.piliers.social === null){
    if(e.social && e.social.oui === true){
      e.piliers.social = true;
      // Tentative de type
      if(/copain|ami|jeux|carte|parc|sortie/i.test(notes + ' ' + allegFact)){
        e.piliers.social_type = 'amis';
      } else if(/famille|fille|enfant/i.test(notes + ' ' + allegFact)){
        e.piliers.social_type = 'famille';
      }
      e._inferred.social = false; // réel
    } else if(e.social && e.social.oui === false){
      e.piliers.social = false;
      e._inferred.social = false;
    }
  }

  // ── 6) Chaleur : parsing notes ──
  if(e.piliers.chaleur === null){
    let type = null, duree = null;
    if(/hammam/i.test(notes)){
      type = 'hammam';
      const m = notes.match(/(\d+)\s*min.{0,15}hammam|hammam.{0,15}(\d+)\s*min/i);
      if(m) duree = m[1] || m[2];
    } else if(/jaccusi|jacuzzi/i.test(notes)){
      type = 'jacuzzi';
    } else if(/bain chaud|bain.{0,30}chaud/i.test(notes)){
      type = 'bain';
    } else if(exercices.includes('chaleur_renfo') || exercices.includes('chaleur')){
      type = 'pad chaud';
    }
    if(type){
      e.piliers.chaleur = true;
      e.piliers.chaleur_type = type;
      if(duree) e.piliers.chaleur_duree = duree;
      e._inferred.chaleur = true;
    }
  }

  // ── 7) Massage : parsing notes ──
  if(e.piliers.massage === null){
    if(/massage/i.test(notes)){
      e.piliers.massage = true;
      if(/all body|corps entier|complet/i.test(notes)) e.piliers.massage_zone = 'corps entier';
      else if(/visage|face/i.test(notes)) e.piliers.massage_zone = 'visage';
      else if(/clavicule|cou|nuque/i.test(notes)) e.piliers.massage_zone = 'cervical';
      else e.piliers.massage_zone = '';
      e._inferred.massage = true;
    }
  }

  // ── 8) Relâchement allongé : depuis allegement.facteurs ──
  if(e.piliers.relachement_allonge === null){
    if(/allong[ée]|fauteuil.{0,15}nuque|sieste/i.test(allegFact + ' ' + allegMoment)){
      e.piliers.relachement_allonge = true;
      e.piliers.relachement_duree = (e.allegement && e.allegement.moment) || '';
      e._inferred.relachement_allonge = true;
    }
  }

  // Marquer comme migré
  e._migrated_v = MIGRATION_VERSION;
  return {entry: e, changed: true};
}

function migrateAll(){
  let migrated = 0;
  let inferred_counts = {
    reveil_spasme: 0, tension_globale_gauche: 0, respiration_ventrale: 0,
    chaleur: 0, massage: 0, relachement_allonge: 0,
  };

  Object.keys(entries).forEach(d => {
    const result = migrateEntry(entries[d]);
    if(result.changed){
      migrated++;
      const inf = entries[d]._inferred || {};
      Object.keys(inferred_counts).forEach(k => {
        if(inf[k]) inferred_counts[k]++;
      });
    }
  });

  return {migrated, inferred_counts};
}

// ── norm() : ajoute structures vides si manquantes (sans inférer) ──
function norm(e){
  if(!e.social)e.social={oui:null,duree:'',qualite:null,avant:null,apres:null};
  if(e.heures_assis===undefined)e.heures_assis='';
  if(!e.exercices)e.exercices=[];
  if(e.sommeil_score===undefined)e.sommeil_score=null;
  if(!e.allegement)e.allegement={oui:null,moment:'',facteurs:'',avant:null,apres:null};
  if(e.allegement.avant===undefined)e.allegement.avant=null;
  if(e.allegement.apres===undefined)e.allegement.apres=null;

  if(!e.piliers) e.piliers = {
    respiration_ventrale: null, relachement_debout: null,
    relachement_allonge: null, relachement_duree: '',
    chaleur: null, chaleur_duree: '', chaleur_type: '',
    jogging: null, jogging_duree: '',
    sommeil_calme: null, social: null, social_type: '',
    massage: null, massage_zone: '',
  };
  if(e.reveil_spasme === undefined) e.reveil_spasme = null;
  if(e.tension_globale_gauche === undefined) e.tension_globale_gauche = null;
  if(e.parole_intensite === undefined) e.parole_intensite = null;
  if(e.positions_decharge === undefined) e.positions_decharge = '';
  if(!e._inferred) e._inferred = {};
  if(e._migrated_v === undefined) e._migrated_v = 0;

  return e;
}

function emptyEntry(date){
  const e = norm({date,spasmes:{intensite:null,frequence:null,gene:null},
    allegement:{oui:null,moment:'',facteurs:'',avant:null,apres:null},
    sport:{marche:{duree:'',intensite:'',avant:'',apres:''},jogging:{duree:'',intensite:'',avant:'',apres:'',delai:''}},
    posture:{trapeze:null,nuque:null,machoire:null,pommette:null},
    langue:'',respiration:'',exercices:[],social:{oui:null,duree:'',qualite:null,avant:null,apres:null},heures_assis:'',
    wellness:{sommeil_qualite:null,energie:null,stress:null,bienetre:null},
    sommeil_duree:'',sommeil_profond:'',sommeil_score:null,magnesium:'',hydratation:'',humeur:'',notes:''});
  // Une nouvelle entrée n'a pas besoin de migration
  e._migrated_v = MIGRATION_VERSION;
  return e;
}

// ── Storage ──
function load(){
  try{
    const raw=localStorage.getItem(SK);
    if(raw){
      const saved=JSON.parse(raw);
      HIST.forEach(h=>{entries[h.date]=norm({...h});});
      Object.keys(saved).forEach(d=>{entries[d]=norm(saved[d]);});
    } else {
      HIST.forEach(h=>{entries[h.date]=norm({...h});});
    }
  }catch{HIST.forEach(h=>{entries[h.date]=norm({...h});});}

  // Lancer la migration si version trop ancienne
  const lastMig = parseInt(localStorage.getItem(MIG_KEY) || '0', 10);
  if(lastMig < MIGRATION_VERSION){
    migrationStats = migrateAll();
    save();
    localStorage.setItem(MIG_KEY, String(MIGRATION_VERSION));
  }
}
function save(){
  try{
    localStorage.setItem(SK,JSON.stringify(entries));
    const st=document.getElementById('save-st');
    if(st){st.textContent='✓ sauvegardé';st.style.color='var(--green)';}
  }catch{
    const st=document.getElementById('save-st');
    if(st){st.textContent='⚠ erreur';st.style.color='var(--red)';}
  }
}

// ── Deep set by path ──
function setVal(path, val){
  if(!entries[activeDate]) entries[activeDate] = emptyEntry(activeDate);
  const e = entries[activeDate];
  const p = path.split('.');
  let o = e;
  for(let i=0;i<p.length-1;i++){
    if(o[p[i]] === undefined || o[p[i]] === null) o[p[i]] = {};
    o = o[p[i]];
  }
  o[p[p.length-1]] = val;

  // Si l'utilisateur modifie un champ, ce n'est plus "inféré"
  const inferredKey = path.replace('piliers.','').replace(/_(duree|type|zone)$/,'');
  if(e._inferred && e._inferred[inferredKey]) delete e._inferred[inferredKey];

  save();
  patchButtons(path, val);
  patchConditionalSections(path, val);
  patchPillarStates(path, val);
  renderDateStrip();
}

function togEx(id){
  if(!entries[activeDate]) entries[activeDate] = emptyEntry(activeDate);
  const e = entries[activeDate];
  if(!e.exercices) e.exercices = [];
  const i = e.exercices.indexOf(id);
  if(i>=0) e.exercices.splice(i,1); else e.exercices.push(id);
  save();
  document.querySelectorAll(`.exrow[data-id="${id}"]`).forEach(row => {
    const on = e.exercices.includes(id);
    row.classList.toggle('on', on);
  });
}

// ── Targeted DOM patches ──
function patchButtons(path, val){
  document.querySelectorAll(`.sbtn[data-path="${path}"]`).forEach(btn=>{
    const bval = btn.dataset.val === 'null' ? null : Number(btn.dataset.val);
    const on = bval === val;
    btn.classList.toggle('on', on);
    const col = btn.dataset.color;
    btn.style.background = on ? col : '';
    btn.style.borderColor = on ? col : '';
  });
  document.querySelectorAll(`.tbtn[data-path="${path}"]`).forEach(btn=>{
    const on = btn.dataset.val === String(val) || (val === true && btn.dataset.val === 'true') || (val === false && btn.dataset.val === 'false') || (val === null && btn.dataset.val === 'null');
    btn.classList.toggle('on', on);
    const col = btn.dataset.color;
    btn.style.background = on ? col : '';
    btn.style.borderColor = on ? col : '';
  });
  document.querySelectorAll(`.pillar-yes[data-path="${path}"]`).forEach(btn=>{
    btn.classList.toggle('on', val === true);
  });
  document.querySelectorAll(`.pillar-no[data-path="${path}"]`).forEach(btn=>{
    btn.classList.toggle('on', val === false);
  });
}

    if(card) card.classList.toggle('done', val === true);
    const fields = document.getElementById('pillar-chaleur-fields');
    if(fields) fields.classList.toggle('show', val === true);
  }
  if(path === 'piliers.jogging'){
    const card = document.getElementById('pillar-jogging');
    if(card) card.classList.toggle('done', val === true);

function patchConditionalSections(path, val){
  if(path === 'allegement.oui'){
    const sec = document.getElementById('allegement-fields');
    if(sec) sec.style.display = val === true ? 'flex' : 'none';
  }
  if(path === 'allegement.avant' || path === 'allegement.apres'){refreshAllegementImpact();}
  if(path === 'social.oui'){
    const sec = document.getElementById('social-fields');
    if(sec) sec.style.display = val === true ? 'block' : 'none';
  }
  if(path === 'social.avant' || path === 'social.apres'){refreshSocialImpact();}
  if(path === 'heures_assis'){
    const badge = document.getElementById('assis-badge');
    if(badge){
      const n = parseFloat(val);
      if(!isNaN(n)){
        badge.style.display = '';
        badge.style.color = assisC(val);
        badge.style.background = assisBg(val);
        badge.textContent = n+'h '+(n<=2?'✓':n<=5?'⚠':'⚠⚠');
      } else {
        badge.style.display = 'none';
      }
    }
  }
}

function refreshAllegementImpact(){
  const e = entries[activeDate];
  if(!e) return;
  const al = e.allegement || {};
  const el = document.getElementById('allegement-impact');
  if(!el) return;
  if(al.avant != null && al.apres != null){
    const diff = al.apres - al.avant;
    const col = diff < 0 ? 'var(--green)' : diff > 0 ? 'var(--red)' : 'var(--mid)';
    const bg = diff < 0 ? '#edfbf3' : diff > 0 ? '#fdf0f0' : '#f5f5f5';
    const bc = diff < 0 ? 'var(--green)' : diff > 0 ? 'var(--red)' : 'var(--border)';
    const txt = diff < 0 ? '↓ amélioration de '+Math.abs(diff)+' point'+(Math.abs(diff)>1?'s':'')
              : diff > 0 ? '↑ aggravation de '+diff+' point'+(diff>1?'s':'')
              : '→ pas de changement';
    el.style.display = '';
    el.style.background = bg;
    el.style.border = '1px solid '+bc;
    el.querySelector('span').style.color = col;
    el.querySelector('span').textContent = txt;
  } else {
    el.style.display = 'none';
  }
}

// ── Helpers ──
function sc(v){return v<=2?'var(--green)':v<=3?'#e67e22':'var(--red)';}
function avg(e){
  const v=[e.spasmes.intensite,e.spasmes.frequence,e.spasmes.gene].filter(x=>x!=null);
  return v.length?(v.reduce((a,b)=>a+b,0)/v.length).toFixed(1):null;
}
function assisC(h){const n=parseFloat(h);return isNaN(n)?'var(--faint)':n<=2?'var(--green)':n<=5?'#e67e22':'var(--red)';}
function assisBg(h){const n=parseFloat(h);return isNaN(n)?'':n<=2?'#edfbf3':n<=5?'#fef9ec':'#fdf0f0';}
function sommeilScoreC(v){return v==null?'':v>=8?'var(--green)':v>=5?'#e67e22':'var(--red)';}

function isInferred(e, key){
  return !!(e._inferred && e._inferred[key]);
}
function infBadge(){return ' <span class="inferred-badge" title="Valeur inférée du passé">inféré</span>';}

// ── Export ──
function exportJSON(){
  const data=JSON.stringify(entries,null,2);
  const blob=new Blob([data],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download='journal_spasmes_'+today()+'.json';
  document.body.appendChild(a);a.click();
  document.body.removeChild(a);URL.revokeObjectURL(url);
}

function renderExerciseSections(exercices){
  return EX_SECTIONS.map(sec => {
    const doneInSec = sec.steps.flatMap(st => st.items).filter(it => exercices && exercices.includes(it.id)).length;
    const totalInSec = sec.steps.flatMap(st => st.items).length;
    const progressTxt = doneInSec > 0 ? ` · ${doneInSec}/${totalInSec}` : '';

    const stepsHtml = sec.steps.map(step => {
      const rowsHtml = step.items.map(it => exerciseRow(it, exercices)).join('');
      return `<div class="step-lbl">${step.label}</div>${rowsHtml}`;
    }).join('');

    return `<div class="day-section ${sec.cls}">
      <div class="day-section-title">${sec.label}<span style="font-weight:400;opacity:.6">${progressTxt}</span></div>
      <div class="day-section-sub">${sec.sub}</div>
      ${stepsHtml}
    </div>`;
  }).join('');
}

// ── Migration banner ──
function renderMigBanner(){
  if(!migrationStats || migrationStats.migrated === 0) return '';
  if(localStorage.getItem('journal_spasmes_MIG_DISMISSED') === '1') return '';
  const ic = migrationStats.inferred_counts;
  return `<div class="mig-banner" id="mig-banner">
    <button class="mig-banner-close" onclick="dismissMigBanner()">×</button>
    <strong>📦 Migration : ${migrationStats.migrated} entrées enrichies</strong><br>
    Réveil×${ic.reveil_spasme} · Tension×${ic.tension_globale_gauche} · Respi×${ic.respiration_ventrale} · Chaleur×${ic.chaleur} · Massage×${ic.massage} · Relâch.×${ic.relachement_allonge}<br>
    <span style="font-size:9px;opacity:.7">Les valeurs inférées portent un badge "inféré" — tu peux les corriger en cliquant dessus.</span>
  </div>`;
}

// ── History render ──
function renderHistory(){
  const dates=Object.keys(entries).sort((a,b)=>b.localeCompare(a));
  let html='<div style="padding-top:16px">';
  dates.forEach(date=>{
    const e=entries[date];
    const a=avg(e);if(a===null)return;
    const totalDone = e.exercices ? e.exercices.length : 0;
    const soc=e.social||{};
    const si=soc.oui&&soc.avant!=null&&soc.apres!=null?soc.apres-soc.avant:null;
    const al=e.allegement||{};
    const aiDiff=al.oui&&al.avant!=null&&al.apres!=null?al.apres-al.avant:null;
    const p = e.piliers || {};
    const pillarsDone = [
      p.respiration_ventrale !== null && p.respiration_ventrale >= 3,
      p.relachement_allonge === true,
      p.chaleur === true,
      p.jogging === true,
      e.reveil_spasme === false,
      p.social === true,
      p.massage === true,
    ].filter(Boolean).length;
    const hasInferred = e._inferred && Object.keys(e._inferred).length > 0;

    html+=`<div class="hcard" onclick="selectDate('${date}');switchTab('form')">
      <div class="htop">
        <div class="hdate">${frDate(date).toUpperCase()}${hasInferred?' <span class="inferred-badge">inféré</span>':''}</div>
        <div class="hscore" style="background:${sc(parseFloat(a))}">${a}</div>
      </div>
      <div class="badges">
        ${e.reveil_spasme===false?`<span class="badge" style="background:#edfbf3;color:var(--green)">🌅 calme</span>`:e.reveil_spasme===true?`<span class="badge" style="background:#fdf0f0;color:var(--red)">🌅 spasme</span>`:''}
        ${pillarsDone>0?`<span class="badge" style="background:var(--accent-l);color:var(--accent)">🌟 ${pillarsDone}/7</span>`:''}
        ${p.jogging===true&&p.jogging_duree?`<span class="badge" style="background:#edfbf3;color:var(--green)">🏃 ${p.jogging_duree}min</span>`:e.sport&&e.sport.jogging&&e.sport.jogging.duree?`<span class="badge" style="background:#edfbf3;color:var(--green)">🏃 ${e.sport.jogging.duree}min</span>`:''}
        ${p.chaleur===true?`<span class="badge" style="background:#fff8ec;color:var(--accent)">🔥${p.chaleur_type?' '+p.chaleur_type:''}</span>`:''}
        ${p.relachement_allonge===true?`<span class="badge" style="background:#f0faf8;color:var(--teal)">🛋️ relâch.</span>`:''}
        ${p.massage===true?`<span class="badge" style="background:#f5ead8;color:var(--accent)">💆${p.massage_zone?' '+p.massage_zone:''}</span>`:''}
        ${p.social===true?`<span class="badge" style="background:#f0faf8;color:var(--teal)">👥${p.social_type?' '+p.social_type:''}</span>`:''}
        ${e.parole_intensite!=null?`<span class="badge" style="background:#fef9ec;color:var(--orange)">🗣️ ${e.parole_intensite}/5</span>`:''}
        ${e.heures_assis?`<span class="badge" style="background:${assisBg(e.heures_assis)};color:${assisC(e.heures_assis)}">🪑 ${e.heures_assis}h</span>`:''}
        ${al.oui?`<span class="badge" style="background:#edfbf3;color:var(--green)">✓ allégement${aiDiff!==null?(aiDiff<0?' ↓'+Math.abs(aiDiff):aiDiff>0?' ↑'+aiDiff:' →'):''}</span>`:''}
        ${e.wellness&&e.wellness.stress!=null?`<span class="badge" style="background:${e.wellness.stress<=2?'#edfbf3':'#fdf0f0'};color:${e.wellness.stress<=2?'var(--green)':'var(--red)'}">stress ${e.wellness.stress}/5</span>`:''}
      </div>
      ${e.notes?`<div class="hnotes">${e.notes}</div>`:''}
    </div>`;
  });
  html+='</div>';
  document.getElementById('history-view').innerHTML=html;
}

load();
renderDateStrip();
renderForm();
document.getElementById('dstrip').style.display='flex';
